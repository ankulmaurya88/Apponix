<body>
    <!-- 
  Responsive Images 
Images come in all sizes. So do screens. Responsive images automatically adjust to fit the 
size of the screen. 
 
Create responsive images by adding an .img-fluid class to the <img> tag. The image will then 
scale nicely to the parent element. 
 
The .img-fluid class applies max-width: 100%; and height: auto; to the image: 
  -->
    <div class="container mt-3">
        <h2>Image</h2>
        <p>The .img-fluid class makes the image scale nicely to the parent element (resize the
            browser window to see the
            effect):</p>
        <img class="img-fluid" src="team-4.jpg" alt="New York" width="1100" height="500">
    </div>
</body>
</html>
