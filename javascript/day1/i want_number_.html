<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

   <script>
document.write("<h2>Numbers from 1 to 10 using for, while and do...while</h2>");

// FOR LOOP
document.write("<h3>For Loop</h3>");
document.write("<h1>");

for (let i = 1; i <= 10; i++) {
    document.write(i + "&nbsp;&nbsp;");
}

document.write("</h1>");


// WHILE LOOP
document.write("<h3>While Loop</h3>");
document.write("<h1>");

let x = 1;

while (x <= 10) {
    document.write(x + "&nbsp;&nbsp;");
    x++;
}

document.write("</h1>");


// DO WHILE LOOP
document.write("<h3>Do While Loop</h3>");
document.write("<h1>");

x = 1;

do {
    document.write(x + "&nbsp;&nbsp;");
    x++;
} while (x <= 10);

document.write("</h1>");
</script>
</head>
<body>
    
</body>
</html>
