<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">

        div{

            width: 200px; height: 200px; background-size: 200px;
            margin: 20px;
            border-radius: 10px;
            border: 5px solid red ;
        }

        .img1{


            background-image: url('p1.png') ; opacity: 1;
        }
        .img2{
            background-image: url('p2.png');opacity: .75;
        }
        .img3{
            background-image: url('p1.png'); opacity: .50;

        }
        
        .img4{
            background-image: url('p1.png') ; opacity: .25;

        }

    </style>
</head>
<body>
    <div class="img1">
        Image with full transpency
    </div >

    <div class="img2">
        Image with 75  transpency
    </div>

    <div class="img3">
        Image with 50 transpency
    </div>

    <div class="img4">
        Image with 25 transpency
    </div>
</body>
</html>
