<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style type="text/css">
        div {
            width: 35%;
            height: 292px;
            border: 1px solid black;
            margin: 3%;
        }
        
            .Radial-besic {
                background-image: radial-gradient(rgb(197, 72, 72), green, blue);
            }

            .Radial-besic-direction {
                background-image: radial-gradient(circle at top left, rgb(167, 112, 112), green, blue);
            }

            .Radial-besic-angled {
                background-image: radial-gradient(circle, red, green, blue);
            }   
        </style>


        

</head>
<body>
    <!-- 3. Fix attribute: 'clsaa' -> 'class' -->
<div class="Radial-besic">Radial Basic Gradient color</div>
<div class="Radial-besic-direction">Radial Gradient color with Direction</div>
<div class="Radial-besic-angled">Radial Gradient color with angle</div>   
</body>
</html>
