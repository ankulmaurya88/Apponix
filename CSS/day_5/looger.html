<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style type="text/css">
        div {
            width: 35%;
            height: 292px;
            border: 1px solid black;
            margin: 3%;
        }
        .linear-besic 
        {
            background-image: linear-gradient(rgb(197, 72, 72),green,blue);
        }

        .linear-besic-direction
        {
            background-image: linear-gradient(to left,red,green,blue);
        }

        .linear-besic-angled
        {
            background-image: linear-gradient(60deg,red,green,blue);
        }
        </style>


        

</head>
<body>
    <div class="linear-besic">Linear Basic Gradient color</div>
    <div class="linear-besic-direction">Linear Gradient color with Direction</div>
    <div class="linear-besic-angled"> Liner Gradient color with angle </div>

    <div></div>
</body>
</html>
